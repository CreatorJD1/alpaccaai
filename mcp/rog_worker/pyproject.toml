[project]
name = "alpecca-rog-mcp"
version = "0.1.0"
description = "MCP server exposing the Alpecca Jason_HOLYROG compute worker (health, reasoning, vision, Blender, HyFusER) as tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2",
    # Pillow is required only for the vision tool (client-side resize/re-encode).
    "pillow>=10",
]

[project.scripts]
alpecca-rog-mcp = "alpecca_rog_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpecca_rog_mcp"]
